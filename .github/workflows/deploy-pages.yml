name: Publiser Kaloriapp

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sett opp Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer pakker
        run: npm install

      - name: Konfigurer GitHub Pages
        run: node scripts/setup-pwa.mjs

           - name: Bygg webappen
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web

      - name: Legg til PWA-filer
        run: node scripts/pwa-postexport.mjs

      - name: Klargjør Pages
        uses: actions/configure-pages@v5

      - name: Last opp nettsiden
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Last opp nettsiden
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publiser
        id: deployment
        uses: actions/deploy-pages@v4
